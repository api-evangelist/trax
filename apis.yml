apis:
- name: Trax Retail Platform API
  description: >-
    Partner-facing REST API for the Trax retail intelligence platform: master data (stores,
    products, regions, retailers, targets, audit cycle sets), visit planning (routes, visit types,
    tasks, assortments), in-store execution (Input API for sessions/scenes/images, Scene Mobile SDK
    deep-linking), analysis output (Notifier service, JSON results), user management (V4–V6), SSO,
    and a Salesforce connector. Versioned via URI path (for example /api/v5/...). Page-based
    pagination (page / per_page). Auth via Trax credentials or SSO over OAuth 2.0.
  humanURL: https://www.apidoc.traxretail.com/
