name: Trax
description: >-
  Trax (Trax Retail) is a cloud-based retail intelligence platform that uses computer vision and
  image recognition to turn shelf photographs into real-time, actionable in-store insights for
  consumer packaged goods (CPG) brands and retailers. Its platform measures on-shelf availability,
  planogram and pricing compliance, share of shelf, promotional execution, and competitor activity
  across retail locations. Trax exposes a partner API surface for master data management (stores,
  products, regions, retailers), visit planning (routes, tasks, assortments), in-store execution via
  the Scene Mobile SDK and Input API (sessions, scenes, images), and analysis output/notification
  services, plus SSO and a Salesforce connector. Trax merged with FORM to combine retail image
  recognition with task management and workflow automation, and is a portfolio company of the
  SoftBank Vision Fund.
